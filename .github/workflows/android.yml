name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: bun install
      - run: bun run build:mobile
      - name: Add Android platform
        run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -r | head -1)
          echo "using sdkmanager: $SDKM"
          yes 2>/dev/null | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --list_installed 2>/dev/null | head -40 || true
      - name: Gradle assembleDebug
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: starflight-atlas-apk
          path: android/app/build/outputs/apk/debug/*.apk
